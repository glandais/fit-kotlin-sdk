name: gh-pages

# Publishes the browser demo (src/jsMain/resources plus the Kotlin/JS webpack bundle) to
# GitHub Pages. The demo is hand-written and local to this repository; everything under
# src/commonMain, src/jsMain/kotlin and src/*Test is generated by fitgen.
#
# Pages must be enabled once, in Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a running build.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      # `demo` is jsBrowserDistribution: the production webpack bundle and the static
      # files next to it, in one directory ready to be served.
      - run: ./gradlew demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/dist/js/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
